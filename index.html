<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | onXT Landing Page</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">onXT Landing Page</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/cf637d00e485d312795e19ca5e4f2d8a.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/1477ce963adaf760003317b9dbf862b9.data.unityweb",
        frameworkUrl: buildUrl + "/5d1afdcb95a9d5254912fd18fd68cfb5.framework.js.unityweb",
        codeUrl: buildUrl + "/666b2acde2d999e23d5813f04875c220.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "onXT",
        productName: "onXT Landing Page",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  <!-- ONXT_MOBILE_WARNING_START -->
<style>
  #onxt-mobile-warning {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: 16px;
    z-index: 2147483646;
    display: none;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border: 1px solid rgba(255,255,255,.24);
    border-radius: 10px;
    background: rgba(8,20,24,.94);
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    box-shadow: 0 10px 28px rgba(0,0,0,.36);
  }
  #onxt-mobile-warning.onxt-visible { display: flex; }
  #onxt-mobile-warning-text { flex: 1; font-size: 14px; line-height: 1.35; }
  #onxt-mobile-warning-close,
  #onxt-mobile-warning-open {
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 999px;
    background: rgba(255,255,255,.12);
    color: #fff;
    min-width: 38px;
    height: 38px;
    cursor: pointer;
  }
  #onxt-mobile-warning-open {
    position: fixed;
    left: 16px;
    bottom: 16px;
    z-index: 2147483645;
    display: none;
  }
  #onxt-mobile-warning-open.onxt-visible { display: block; }
  #onxt-rotate-overlay {
    position: fixed;
    inset: 0;
    z-index: 2147483647;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 32px;
    background: rgba(4,12,16,.96);
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
  }
  #onxt-rotate-overlay.onxt-visible { display: flex; }
  #onxt-rotate-overlay .onxt-rotate-icon {
    width: 64px;
    height: 64px;
    animation: onxt-rotate-hint 2s ease-in-out infinite;
  }
  @keyframes onxt-rotate-hint {
    0%, 20% { transform: rotate(0deg); }
    55%, 80% { transform: rotate(90deg); }
    100% { transform: rotate(90deg); }
  }
  #onxt-rotate-overlay h2 { margin: 0; font-size: 20px; font-weight: 700; }
  #onxt-rotate-overlay p { margin: 0; max-width: 420px; font-size: 14px; line-height: 1.45; color: rgba(255,255,255,.82); }
  #onxt-rotate-continue {
    margin-top: 8px;
    padding: 10px 22px;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 999px;
    background: rgba(255,255,255,.12);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
</style>
<div id="onxt-mobile-warning" role="dialog" aria-live="polite" aria-label="Mobile browser warning">
  <div id="onxt-mobile-warning-text">This experience is designed for desktop and laptop browsers. On mobile devices it may not run optimally &mdash; landscape mode is recommended.</div>
  <button id="onxt-mobile-warning-close" type="button" aria-label="Dismiss mobile browser warning">x</button>
</div>
<button id="onxt-mobile-warning-open" type="button" aria-label="Reopen mobile browser warning">i</button>
<div id="onxt-rotate-overlay" role="dialog" aria-label="Rotate device">
  <svg class="onxt-rotate-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="22" y="8" width="20" height="48" rx="4" fill="none" stroke="#fff" stroke-width="3"/>
    <circle cx="32" cy="49" r="2.4" fill="#fff"/>
  </svg>
  <h2>Please rotate your device</h2>
  <p>This experience works best in landscape mode. Turn your device sideways to continue.</p>
  <button id="onxt-rotate-continue" type="button">Continue in portrait</button>
</div>
<script>
(function () {
  // On-device console for mobile debugging: append ?debug=1 to the URL.
  if (/[?&]debug=1/.test(window.location.search)) {
    var erudaScript = document.createElement('script');
    erudaScript.src = 'https://cdn.jsdelivr.net/npm/eruda@3/eruda.min.js';
    erudaScript.onload = function () { if (window.eruda) window.eruda.init(); };
    document.body.appendChild(erudaScript);
  }
  var ua = navigator.userAgent || navigator.vendor || '';
  var isMobile = /Android|iPhone|iPad|iPod/i.test(ua) || (/Macintosh|Mac OS X/i.test(ua) && (navigator.maxTouchPoints || 0) > 1);
  if (!isMobile) return;
  var panel = document.getElementById('onxt-mobile-warning');
  var close = document.getElementById('onxt-mobile-warning-close');
  var open = document.getElementById('onxt-mobile-warning-open');
  if (panel && close && open) {
    var show = function () {
      panel.classList.add('onxt-visible');
      open.classList.remove('onxt-visible');
    };
    var hide = function () {
      panel.classList.remove('onxt-visible');
      open.classList.add('onxt-visible');
    };
    close.addEventListener('click', hide);
    open.addEventListener('click', show);
    show();
  }

  // Best effort only: browsers that support it (mostly Android in fullscreen)
  // will lock, everything else rejects and we fall back to the rotate overlay.
  var tryLockLandscape = function () {
    try {
      if (screen.orientation && screen.orientation.lock) {
        var p = screen.orientation.lock('landscape');
        if (p && p.catch) p.catch(function () {});
      }
    } catch (e) {}
  };
  document.addEventListener('touchend', tryLockLandscape, true);
  document.addEventListener('click', tryLockLandscape, true);
  tryLockLandscape();

  var overlay = document.getElementById('onxt-rotate-overlay');
  var continueBtn = document.getElementById('onxt-rotate-continue');
  if (!overlay || !continueBtn) return;
  var rotateDismissed = false;
  try { rotateDismissed = sessionStorage.getItem('onxtRotateDismissed') === '1'; } catch (e) {}
  var isPortrait = function () {
    if (screen.orientation && screen.orientation.type) return screen.orientation.type.indexOf('portrait') === 0;
    return window.innerHeight > window.innerWidth;
  };
  var updateRotateOverlay = function () {
    var visible = isPortrait() && !rotateDismissed;
    overlay.classList.toggle('onxt-visible', visible);
  };
  continueBtn.addEventListener('click', function () {
    rotateDismissed = true;
    try { sessionStorage.setItem('onxtRotateDismissed', '1'); } catch (e) {}
    updateRotateOverlay();
  });
  window.addEventListener('resize', updateRotateOverlay);
  window.addEventListener('orientationchange', updateRotateOverlay);
  if (screen.orientation && screen.orientation.addEventListener) {
    screen.orientation.addEventListener('change', updateRotateOverlay);
  }
  updateRotateOverlay();
})();
</script>
<!-- ONXT_MOBILE_WARNING_END -->
</body>
</html>
